[project]
name = "qsl"
version = "0.1.0"
description = "Quantum Security Lab Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pytest>=9.1.1", "numpy", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsl"]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter", "matplotlib"]
